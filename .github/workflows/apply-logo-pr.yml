name: Apply PocketPiano logo change

on:
  push:
    branches:
      - replace-brand-text-with-logo
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: replace-brand-text-with-logo

      - name: Replace brand text with logo
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_css = '.brand { font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: .82rem; }'
          new_css = '''.brand {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 18px;
          }
          .brand-logo {
            width: 260px;
            max-width: 90%;
            height: auto;
            display: block;
          }'''

          old_html = '<div class="brand">PocketPiano</div>'
          new_html = '''<div class="brand">
                <img src="pocketpiano-logo.svg" alt="PocketPiano" class="brand-logo" />
              </div>'''

          if old_css not in text:
              raise SystemExit('No se encontró el CSS original de .brand')
          if old_html not in text:
              raise SystemExit('No se encontró el encabezado original')

          text = text.replace(old_css, new_css, 1)
          text = text.replace(old_html, new_html, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/apply-logo-pr.yml

      - name: Commit completed change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-logo-pr.yml
          git commit -m "Replace PocketPiano text with responsive logo"
          git push origin HEAD:replace-brand-text-with-logo
