name: Apply PocketPiano logo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace header text with logo
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_css = '.brand { font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: .82rem; }'
          new_css = '''.brand { display: flex; justify-content: center; align-items: center; margin-bottom: 18px; }
.brand-logo { width: 260px; max-width: 90%; height: auto; display: block; }'''

          old_html = '<div class="brand">PocketPiano</div>'
          new_html = '''<div class="brand">
        <img src="pocketpiano-logo.svg" alt="PocketPiano" class="brand-logo">
      </div>'''

          if old_css in text:
              text = text.replace(old_css, new_css, 1)
          if old_html in text:
              text = text.replace(old_html, new_html, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then
            echo "Logo already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace PocketPiano text with logo"
          git push
