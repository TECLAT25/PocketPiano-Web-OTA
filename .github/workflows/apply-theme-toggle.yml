name: Apply theme toggle

on:
  push:
    branches:
      - add-theme-toggle

permissions:
  contents: write

jobs:
  patch-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-theme-toggle

      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          head_marker = '  <title>PocketPiano · Actualización BLE</title>'
          head_insert = '''  <title>PocketPiano · Actualización BLE</title>
  <script>
    (() => {
      const savedTheme = localStorage.getItem('pocketpiano-theme');
      const systemTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = savedTheme || systemTheme;
    })();
  </script>'''

          css_marker = '@media (min-width: 600px) { .shell { padding-top: 48px; } }'
          css_insert = '''@media (min-width: 600px) { .shell { padding-top: 48px; } }

:root {
  --page-bg: #f3f4f6;
  --surface: #ffffff;
  --text: #111827;
  --muted: #4b5563;
  --border: #e5e7eb;
  --secondary-bg: #e5e7eb;
  --secondary-text: #111827;
  --button-bg: #ffffff;
  --button-hover: #f3f4f6;
  color-scheme: light;
}

:root[data-theme="dark"] {
  --page-bg: #0f172a;
  --surface: #1e293b;
  --text: #f8fafc;
  --muted: #cbd5e1;
  --border: #334155;
  --secondary-bg: #334155;
  --secondary-text: #f8fafc;
  --button-bg: #1e293b;
  --button-hover: #334155;
  color-scheme: dark;
}

html, body { background: var(--page-bg); color: var(--text); transition: background-color .2s ease, color .2s ease; }
.card { background: var(--surface); color: var(--text); }
.hint, dt { color: var(--muted); }
.details div { border-top-color: var(--border); }
.secondary { background: var(--secondary-bg); color: var(--secondary-text); }
select { background: var(--surface); color: var(--text); border-color: var(--border); }

.hero { position: relative; }
.theme-toggle {
  position: absolute;
  top: 0;
  right: 4px;
  width: 42px;
  min-height: 42px;
  height: 42px;
  margin: 0;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--button-bg);
  color: var(--text);
  box-shadow: 0 5px 15px rgba(15, 23, 42, .10);
  transition: background-color .2s ease, transform .2s ease, border-color .2s ease;
}
.theme-toggle:hover { background: var(--button-hover); transform: translateY(-1px); }
.theme-toggle:focus-visible { outline: 3px solid #60a5fa; outline-offset: 3px; }
.theme-toggle svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.theme-toggle .icon-sun { display: none; }
:root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
:root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
:root[data-theme="dark"] .brand-logo { filter: invert(1); }
@media (max-width: 420px) { .brand-logo { width: 220px; } .theme-toggle { right: 0; } }'''

          hero_marker = '    <header class="hero">'
          hero_insert = '''    <header class="hero">
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Activar tema oscuro" title="Cambiar tema">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
      </button>'''

          js_marker = "const el = Object.fromEntries([...document.querySelectorAll('[id]')].map(node => [node.id, node]));"
          js_insert = '''const el = Object.fromEntries([...document.querySelectorAll('[id]')].map(node => [node.id, node]));

function applyTheme(theme, save = true) {
  document.documentElement.dataset.theme = theme;
  const dark = theme === 'dark';
  el.themeToggle.setAttribute('aria-label', dark ? 'Activar tema claro' : 'Activar tema oscuro');
  document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0f172a' : '#f3f4f6');
  if (save) localStorage.setItem('pocketpiano-theme', theme);
}

applyTheme(document.documentElement.dataset.theme || 'light', false);
el.themeToggle.addEventListener('click', () => {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
});'''

          replacements = [
            (head_marker, head_insert),
            (css_marker, css_insert),
            (hero_marker, hero_insert),
            (js_marker, js_insert),
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Marker not found: {old[:60]}')
            text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary files and commit
        run: |
          rm -f .github/workflows/apply-theme-toggle.yml .theme-toggle-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-theme-toggle.yml .theme-toggle-trigger
          git commit -m "Add accessible light and dark theme toggle"
          git push origin HEAD:add-theme-toggle